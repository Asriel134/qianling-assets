<script>
'use strict';
const data=JSON.parse(document.getElementById('catalog').textContent);
const byId=id=>document.getElementById(id);
for(const [id,dict] of [['character',data.characters],['place',data.places],['time',data.times]]){
  for(const [value,label] of Object.entries(dict)){
    if(id==='place'&&!data.assets.some(a=>a.places.includes(value)))continue;
    if(id==='time'&&!data.assets.some(a=>a.scene_times.includes(value)))continue;
    const option=document.createElement('option');option.value=value;option.textContent=label;byId(id).append(option);
  }
}
function link(text,href,className){const el=document.createElement('a');el.textContent=text;el.href=href;if(className)el.className=className;return el;}
function render(){
  const character=byId('character').value,place=byId('place').value,time=byId('time').value,content=byId('content').value;
  const query=byId('search').value.trim().toLowerCase();
  const items=data.assets.filter(a=>(!character||a.character_id===character)&&(!place||a.places.includes(place))&&(!time||a.scene_times.includes(time))&&(!content||a.content_type===content)&&(!query||(a.record_id+' '+a.asset_id+' '+(a.display_name||'')).toLowerCase().includes(query)));
  const fragment=document.createDocumentFragment();
  for(const a of items){
    const card=document.createElement('article');card.className='card';
    const picture=link('',a.image,'image');picture.target='_blank';picture.rel='noopener';
    const image=document.createElement('img');image.src=a.thumbnail||a.image;image.loading='lazy';image.decoding='async';image.width=a.width;image.height=a.height;image.alt=a.character+' · '+a.places.map(p=>data.places[p]||p).join('／');picture.append(image);
    const meta=document.createElement('div');meta.className='meta';const h=document.createElement('h2');h.textContent=a.display_name||a.character;
    const info=document.createElement('p');info.textContent=a.places.map(p=>data.places[p]||p).join('／')+' · '+a.scene_times.map(t=>data.times[t]||t).join('／')+' · '+a.content_type;
    const rid=document.createElement('p');rid.textContent=a.record_id;
    const links=document.createElement('div');links.className='links';links.append(link('原尺寸图',a.image));
    meta.append(h,info,rid,links);card.append(picture,meta);fragment.append(card);
  }
  byId('grid').replaceChildren(fragment);byId('empty').hidden=items.length!==0;
  byId('status').textContent='当前显示 '+items.length+' / '+data.assets.length+' 张';
}
for(const id of ['character','place','time','content'])byId(id).addEventListener('change',render);
byId('search').addEventListener('input',render);
byId('reset').addEventListener('click',()=>{for(const id of ['character','place','time','content','search'])byId(id).value='';render();});
byId('updated').textContent='更新于 '+new Date(data.updated_at).toLocaleString('zh-CN');
render();
